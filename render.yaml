# Notes:
# - Replace the repo URL and branch with your project's repository and branch.
# - If your app requires environment secrets (API keys, JWT_SECRET, S3 keys), create them
#   in the Render dashboard and reference them using `envVars` with `fromSecret` keys or
#   set them directly in the Render dashboard after deployment.
# - If your project uses yarn, replace build/start commands accordingly, e.g. "yarn install" and "yarn start".
# - The DATABASE_URL `fromDatabase` field will automatically inject the DB connection string
#   Render provides for the managed Postgres instance named `node-crud-app-db`.
# - Keep healthCheckPath pointing to a lightweight endpoint (e.g. /api/health) that returns 200.
# - Adjust instanceType, plan, region, and disk to match your expected traffic and budget.
# - To add a static frontend site, add a `static_site` block pointing to the frontend directory.

