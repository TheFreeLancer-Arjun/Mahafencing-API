# Render manifest for a Node.js CRUD application
# Replace placeholders (REPO_NAME, BRANCH, SECRET_NAMES, etc.) with your actual values.

services:
  - type: web_service
    name: node-crud-app-web
    env: node
    plan: starter # change to free, standard-1, etc. as needed
    region: oregon # change to "oregon" or "iad" depending on preference
    repo: https://github.com/TheFreeLancer-Arjun/Mahafencing-API
    branch: main
    buildCommand: "npm ci && npm run build || true"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: node-crud-app-db
      - key: PORT
        value: "10000"
    autoDeploy: true
    healthCheckPath: /api/health
    instanceType: "starter-1x"
    disk: 10

databases:
  - name: node-crud-app-db
    type: postgres
    plan: starter # change to standard-0, standard-1, etc.
    region: oregon
    disk: 10

