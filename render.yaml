services:
  - type: web
    name: node-crud-app-web
    env: node
    plan: starter # change to free, standard-1, etc. as needed
    region: oregon # change to "oregon" or "iad"
    repo: https://github.com/TheFreeLancer-Arjun/Mahafencing-API
    branch: main
    buildCommand: "npm install"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: node-crud-app-db
      - key: PORT
        value: "10000"
    autoDeploy: true
    healthCheckPath: /api/health
    instanceType: starter

databases:
  - name: node-crud-app-db
    type: postgres
    plan: starter
    region: oregon
